# Development overrides applied automatically by Docker Compose.

services:
  ml:
    volumes:
      - ./src/ml:/app
      - /app/.venv
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      target: build
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    volumes:
      - ./src/backend:/src
    command: ["dotnet", "watch", "run", "--project", "/src/backend.csproj", "--urls", "http://+:8080"]

  frontend:
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0", "-p", "3000"]
