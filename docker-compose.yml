services:
  ml:
    build:
      context: ./src/ml
      dockerfile: Dockerfile
    container_name: copilot_ml
    ports:
      - "${ML_SERVICE_PORT:-8001}:8001"

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: copilot_backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ML_SERVICE_BASE_URL: http://ml:8001
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_PORT:-5000}:8080"
    depends_on:
      ml:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5000}
    container_name: copilot_frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
